provider: gcp
gcp: true
providerDefaultBranch: main
major-version: 9
parallel: 2
providerVersion: "github.com/hashicorp/terraform-provider-google-beta/version.ProviderVersion"
esc:
    enabled: true
env:
    GOOGLE_CI_SERVICE_ACCOUNT_EMAIL: pulumi-ci@pulumi-ci-gcp-provider.iam.gserviceaccount.com
    GOOGLE_CI_WORKLOAD_IDENTITY_POOL: pulumi-ci
    GOOGLE_CI_WORKLOAD_IDENTITY_PROVIDER: pulumi-ci
    GOOGLE_PROJECT: "pulumi-ci-gcp-provider"
    GOOGLE_PROJECT_NUMBER: 895284651812
    GOOGLE_REGION: "us-central1"
    GOOGLE_ZONE: "us-central1-a"
    PULUMI_MISSING_DOCS_ERROR: true
upstream-provider-repo: terraform-provider-google-beta
makeTemplate: bridged
disableMajorProviderUpgrades: true
goBuildParallelism: 2
# Use `pulumi convert` for translating examples from TF to Pulumi.
pulumiConvert: 1
integrationTestProvider: true
allowMissingDocs: false
releaseVerification:
    nodejs: examples/bucket
    python: examples/bucket-py
    dotnet: examples/serverless-cs
    go: examples/bucket-go
autoMergeProviderUpgrades: false
runner:
    buildSdk: pulumi-ubuntu-8core
# v9 is the maintenance branch for the previous major. Skip the registry docs
# build so pulumi.com keeps showing v10.
publishRegistry: false
publish:
    # Move the latest-v9 npm dist-tag on each stable v9 release, so v9 stays
    # installable by tag while `latest` tracks v10.
    npmDistTag: latest-v9
