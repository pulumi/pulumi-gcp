# WARNING: This file is autogenerated - changes will be overwritten when regenerated by https://github.com/pulumi/ci-mgmt

name: maintenance-release

on:
  schedule:
    - cron: 0 9 1 * *
  workflow_dispatch: {}

env:
  MAINTENANCE_BRANCH: v9
  CURRENT_MAJOR: 10

jobs:
  open-tracking-issue:
    name: Open the monthly security patch ticket
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check whether the maintenance branch is still supported
        id: support
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          supported=true

          # If the support branch is more than one major version behind, it is end of life
          # and a new maintenance branch is needed.
          previous_major="v$((CURRENT_MAJOR - 1))"
          if [[ "$MAINTENANCE_BRANCH" != "$previous_major"* ]]; then
            supported=false
          fi

          if [ "$supported" = true ]; then
            ga=$(gh api "repos/${{ github.repository }}/releases/tags/v${CURRENT_MAJOR}.0.0" \
                   --jq .published_at 2>/dev/null || true)
            if [ -z "$ga" ]; then
              echo "no v${CURRENT_MAJOR}.0.0 release found; cannot derive an end of support date" >&2
              exit 1
            fi
            eol=$(date -u -d "$ga + 12 months" +%Y-%m-%d)
            echo "eol=$eol" >> "$GITHUB_OUTPUT"
            if [ "$(date -u +%Y-%m-%d)" \> "$eol" ]; then
              supported=false
            fi
          fi

          echo "supported=$supported" >> "$GITHUB_OUTPUT"

      - name: Report that support has lapsed
        if: steps.support.outputs.supported == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="${MAINTENANCE_BRANCH} is end of life"
          if [ -n "$(gh issue list --search "\"$title\" in:title" --state all --json number --jq '.[0].number')" ]; then
            exit 0
          fi
          gh issue create --title "$title" --body \
            "\`${MAINTENANCE_BRANCH}\` is no longer supported.

          Remove \`maintenanceBranch\` from \`.ci-mgmt.yaml\` and regenerate to retire this workflow, or replace it with the current maintenance branch."

      - name: Open this month's tracking issue
        if: steps.support.outputs.supported == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          search="Security patch release: ${MAINTENANCE_BRANCH}"
          open=$(gh issue list --search "\"$search\" in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            echo "#${open} is still open; last cycle has not shipped. Not opening another."
            exit 0
          fi

          month=$(date -u +%Y-%m)
          gh issue create \
            --title "${search} (${month})" \
            --body "Scan the maintenance branch for vulnerabilities and address as per long-term support policy.

          - Branch: \`${MAINTENANCE_BRANCH}\`
          - Support ends: ${{ steps.support.outputs.eol }}"
