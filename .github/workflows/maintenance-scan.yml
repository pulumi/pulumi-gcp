# WARNING: This file is autogenerated - changes will be overwritten when regenerated by https://github.com/pulumi/ci-mgmt

name: maintenance-scan

on:
  schedule:
    - cron: 17 9 * * *
  workflow_dispatch: {}

env:
  MAINTENANCE_BRANCH: v9
  MIN_SEVERITY: "7.0"

jobs:
  scan:
    name: Scan maintenance branch for advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MAINTENANCE_BRANCH }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: provider/go.mod

      # Upstream needed for call analysis.
      - name: Prepare upstream
        run: |
          set -euo pipefail
          if [ -x scripts/upstream.sh ]; then
            ./scripts/upstream.sh init
          else
            echo "no scripts/upstream.sh; nothing to prepare"
          fi

      - name: Install osv-scanner
        run: |
          set -euo pipefail
          curl -sSfL -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Scan
        run: |
          set -euo pipefail
          set +e
          osv-scanner scan source -r --format=json --output-file=osv-raw.json provider/ sdk/
          rc=$?
          set -e
          # 0 means it found nothing and 1 means it found vulnerabilities; both scanned.
          if [ "$rc" -gt 1 ]; then
            echo "osv-scanner failed with status $rc" >&2
            exit 1
          fi

      - name: Select qualifying advisories
        run: |
          set -euo pipefail
          # Each group carries max_severity as a number and, per advisory id, whether the
          # vulnerable symbol is actually reached.
          jq --argjson min "$MIN_SEVERITY" '
            [ .results[] as $r
              | $r.packages[] as $p
              | $p.groups[] as $g
              | ($g.experimental_analysis // {}) as $analysis
              | ($g.ids[0]) as $id
              | { id: $id,
                  aliases: $g.aliases,
                  severity: (($g.max_severity // "") | tonumber? // null),
                  reached: (if $analysis | has($id) then $analysis[$id].called else null end),
                  package: $p.package.name,
                  version: $p.package.version,
                  published: ([$p.vulnerabilities[] | select(.id == $id) | .published][0] // null),
                  fixed: ([$p.vulnerabilities[] | select(.id == $id) | .affected[]?.ranges[]?.events[]?.fixed] | last // null) } ]
            | unique_by(.id)
            | map(select(.severity != null and .severity >= $min))
            | sort_by(-(.severity // 0))' osv-raw.json > qualifying.json

          echo "qualifying: $(jq length qualifying.json) ($(jq '[.[]|select(.reached)]|length' qualifying.json) reachable)"

      - name: Post new advisories to the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$(jq length qualifying.json)" -eq 0 ]; then
            echo "nothing to report"
            exit 0
          fi

          search="Security patch release: ${MAINTENANCE_BRANCH}"
          number=$(gh issue list --search "\"$search\" in:title" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "no open ticket to report against"
            exit 0
          fi

          # Anything already named anywhere in the thread has been reported; only genuinely
          # new advisories are worth notifying someone about.
          seen=$(
            { gh issue view "$number" --json body --jq .body
              gh issue view "$number" --json comments --jq '.comments[].body'; } | tr -d '\n'
          )
          jq --arg seen "$seen" '[.[] | select(.id as $id | ($seen | contains($id)) | not)]' qualifying.json > new.json

          if [ "$(jq length new.json)" -eq 0 ]; then
            echo "no advisories that have not already been reported"
            exit 0
          fi

          {
            echo "Advisories on \`${MAINTENANCE_BRANCH}\` as of $(date -u +%Y-%m-%d)."
            echo
            echo "Reachable means the vulnerable code is actually called. The rest are still"
            echo "reported because a customer's own scanner will flag them regardless."
            echo "\`unknown\` means call analysis did not run, not that the code is unreachable."
            echo
            echo "| CVSS | Advisory | Package | Present | Fixed in | Reachable | Published |"
            echo "|---|---|---|---|---|---|---|"
            jq -r '.[] | "| \(.severity // "unrated") | \(.id) | \(.package) | \(.version) | \(.fixed // "—") | \(if .reached == true then "yes" elif .reached == false then "no" else "unknown" end) | \(.published[0:10]) |"' new.json
          } > comment.md

          gh issue comment "$number" --body-file comment.md
